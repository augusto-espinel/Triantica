<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Triantica</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brain.js@2.0.0-beta.23/dist/browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <script type="module">
        import { AIPlayer } from './AIPlayer.js';
        import { RandomPlayer } from './src/players/RandomPlayer.js';
        import { HeuristicPlayer } from './src/players/HeuristicPlayer.js';
        
        // Make available globally for game.js
        window.AIPlayer = AIPlayer;
        window.RandomPlayer = RandomPlayer;
        window.HeuristicPlayer = HeuristicPlayer;
    </script>
    <script src="game.js"></script>
</body>
</html>
