<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Triantica</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#03060C" />
    <meta name="description" content="A grid-based triangle placement strategy game with AI trained via reinforcement learning" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Triantica" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Manifest (relative path for GitHub Pages) -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Fallback icons for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #03060C;
            background-image: radial-gradient(circle at 50% 42%, #081528 0%, #03060C 75%);
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        canvas {
            display: block;
        }
        /* On tall portrait mobile screens, shift the canvas slightly above geometric midpoint for optical centering */
        @media (max-aspect-ratio: 3/4) {
            canvas {
                transform: translateY(-4vh);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brain.js@2.0.0-beta.23/dist/browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('[PWA] Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.warn('[PWA] Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</head>
<body>
    <div id="game-container"></div>
    <script type="module">
        import { AIPlayer } from './AIPlayer.js';
        import { RandomPlayer } from './src/players/RandomPlayer.js';
        import { HeuristicPlayer } from './src/players/HeuristicPlayer.js';
        
        // Make available globally for game.js
        window.AIPlayer = AIPlayer;
        window.RandomPlayer = RandomPlayer;
        window.HeuristicPlayer = HeuristicPlayer;
    </script>
    <script src="game.js"></script>
</body>
</html>
