<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Share Tech Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrC" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00F0FF"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF4D6D"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00FF88"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#03060C" rx="8"/>
  <rect x="1" y="1" width="798" height="518" fill="none" stroke="#0D4054" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#00F0FF" font-size="16" font-weight="bold" filter="url(#glow)">REINFORCEMENT LEARNING TRAINING LOOP</text>
  <text x="400" y="56" text-anchor="middle" fill="#5CE1E6" font-size="11">Self-Play → Experience → Learn → Repeat</text>

  <!-- 1. Environment / Game -->
  <rect x="60" y="90" width="180" height="80" rx="8" fill="#071120" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow)"/>
  <text x="150" y="118" text-anchor="middle" fill="#00F0FF" font-size="13" font-weight="bold">🎮 ENVIRONMENT</text>
  <text x="150" y="138" text-anchor="middle" fill="#B8D4EA" font-size="10">Triantica 10×10 T² Grid</text>
  <text x="150" y="154" text-anchor="middle" fill="#5CE1E6" font-size="9">state, legal_moves, reward</text>

  <!-- 2. Agent / Policy Network -->
  <rect x="560" y="90" width="180" height="80" rx="8" fill="#071120" stroke="#FF4D6D" stroke-width="1.5" filter="url(#glow)"/>
  <text x="650" y="118" text-anchor="middle" fill="#FF4D6D" font-size="13" font-weight="bold">🧠 AGENT (π_θ)</text>
  <text x="650" y="138" text-anchor="middle" fill="#B8D4EA" font-size="10">2-Head ConvNet + MCTS</text>
  <text x="650" y="154" text-anchor="middle" fill="#FF4D6D" font-size="9">P(a|s), V(s)</text>

  <!-- 3. Self-Play Games -->
  <rect x="280" y="220" width="240" height="70" rx="8" fill="#071120" stroke="#FFB800" stroke-width="1.5"/>
  <text x="400" y="248" text-anchor="middle" fill="#FFB800" font-size="13" font-weight="bold">⚔️ SELF-PLAY GAMES</text>
  <text x="400" y="268" text-anchor="middle" fill="#B8D4EA" font-size="10">100 games/cycle × 10 cycles</text>

  <!-- 4. Replay Buffer -->
  <rect x="60" y="340" width="180" height="80" rx="8" fill="#071120" stroke="#00FF88" stroke-width="1.5"/>
  <text x="150" y="368" text-anchor="middle" fill="#00FF88" font-size="13" font-weight="bold">💾 REPLAY BUFFER</text>
  <text x="150" y="388" text-anchor="middle" fill="#B8D4EA" font-size="10">FIFO 45K samples</text>
  <text x="150" y="404" text-anchor="middle" fill="#00FF88" font-size="9">(s, π_MCTS, z, player)</text>

  <!-- 5. Training / Gradient Update -->
  <rect x="560" y="340" width="180" height="80" rx="8" fill="#071120" stroke="#0066FF" stroke-width="1.5"/>
  <text x="650" y="368" text-anchor="middle" fill="#4D94FF" font-size="13" font-weight="bold">⚡ GRADIENT UPDATE</text>
  <text x="650" y="388" text-anchor="middle" fill="#B8D4EA" font-size="10">Policy CE + Value MSE</text>
  <text x="650" y="404" text-anchor="middle" fill="#4D94FF" font-size="9">Adam, LR cosine decay</text>

  <!-- 6. Evaluation -->
  <rect x="310" y="440" width="180" height="60" rx="8" fill="#071120" stroke="#5CE1E6" stroke-width="1"/>
  <text x="400" y="467" text-anchor="middle" fill="#5CE1E6" font-size="12" font-weight="bold">📊 EVALUATE</text>
  <text x="400" y="484" text-anchor="middle" fill="#B8D4EA" font-size="9">vs Random / vs Heuristic</text>

  <!-- Arrows: Environment → Agent (state → action) -->
  <path d="M240 115 L560 115" fill="none" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="400" y="108" text-anchor="middle" fill="#00F0FF" font-size="10">state s</text>

  <!-- Arrows: Agent → Environment (action) -->
  <path d="M560 145 L240 145" fill="none" stroke="#FF4D6D" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="400" y="162" text-anchor="middle" fill="#FF4D6D" font-size="10">action a ~ π_MCTS</text>

  <!-- Arrows: Environment → Self-Play -->
  <path d="M200 170 Q250 220 280 245" fill="none" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Arrows: Agent → Self-Play -->
  <path d="M600 170 Q550 220 520 245" fill="none" stroke="#FFB800" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Arrows: Self-Play → Replay Buffer -->
  <path d="M340 290 Q250 320 200 340" fill="none" stroke="#00FF88" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="250" y="320" text-anchor="middle" fill="#00FF88" font-size="9">experience tuples</text>

  <!-- Arrows: Replay Buffer → Training -->
  <path d="M240 380 L560 380" fill="none" stroke="#00FF88" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="400" y="374" text-anchor="middle" fill="#00FF88" font-size="10">random batch (256)</text>

  <!-- Arrows: Training → Agent (updated weights) -->
  <path d="M650 340 L650 170" fill="none" stroke="#0066FF" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="680" y="260" fill="#4D94FF" font-size="9">θ ← θ - α∇L</text>

  <!-- Arrows: Evaluate -->
  <path d="M400 290 L400 440" fill="none" stroke="#5CE1E6" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrC)"/>

  <!-- Cycle indicator -->
  <text x="740" y="500" text-anchor="end" fill="#4A6A8A" font-size="9">← one training cycle →</text>
</svg>
