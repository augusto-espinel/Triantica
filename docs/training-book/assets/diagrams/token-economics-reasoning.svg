<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Share Tech Mono', 'Courier New', monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glmBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D94FF"/>
      <stop offset="100%" stop-color="#1A3A7A"/>
    </linearGradient>
    <linearGradient id="argBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#005533"/>
    </linearGradient>
    <linearGradient id="locBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#7A5B00"/>
    </linearGradient>
    <linearGradient id="reasonGlm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#7A0033"/>
    </linearGradient>
    <linearGradient id="reasonArg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#7A4400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="#03060C" rx="8"/>
  <rect x="1" y="1" width="798" height="358" fill="none" stroke="#0D4054" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#00F0FF" font-size="13" font-weight="bold" filter="url(#glow)">REASONING TOKEN % &amp; COMPLETION BREAKDOWN BY MODEL</text>
  <text x="400" y="48" text-anchor="middle" fill="#5CE1E6" font-size="9">Hidden chain-of-thought deliberation vs visible output — billed at same rate</text>

  <!-- Y-axis label -->
  <text x="20" y="200" text-anchor="middle" fill="#4A6A8A" font-size="10" transform="rotate(-90 20 200)">Completion Tokens (M)</text>

  <!-- Grid lines -->
  <g stroke="#0D4054" stroke-width="0.5" stroke-dasharray="3 4">
    <line x1="70" y1="80" x2="760" y2="80"/>
    <line x1="70" y1="140" x2="760" y2="140"/>
    <line x1="70" y1="200" x2="760" y2="200"/>
    <line x1="70" y1="260" x2="760" y2="260"/>
  </g>

  <!-- Y-axis tick labels -->
  <text x="62" y="84" text-anchor="end" fill="#4A6A8A" font-size="9">2.0M</text>
  <text x="62" y="144" text-anchor="end" fill="#4A6A8A" font-size="9">1.5M</text>
  <text x="62" y="204" text-anchor="end" fill="#4A6A8A" font-size="9">1.0M</text>
  <text x="62" y="264" text-anchor="end" fill="#4A6A8A" font-size="9">0.5M</text>
  <text x="62" y="320" text-anchor="end" fill="#4A6A8A" font-size="9">0</text>

  <!-- GLM-5 bar stack -->
  <!-- Visible output: 1.35M → height = 1.35/2.0 * 240 = 162 -->
  <rect x="140" y="158" width="120" height="162" rx="3" fill="url(#glmBar)" opacity="0.9"/>
  <!-- Reasoning: 0.68M → height = 0.68/2.0 * 240 = 82 -->
  <rect x="140" y="76" width="120" height="82" rx="3" fill="url(#reasonGlm)" opacity="0.9"/>

  <!-- GLM-5 labels -->
  <text x="200" y="245" text-anchor="middle" fill="#B8D4EA" font-size="10">1.35M</text>
  <text x="200" y="260" text-anchor="middle" fill="#4A6A8A" font-size="8">Visible Output</text>
  <text x="200" y="122" text-anchor="middle" fill="#FFD4DD" font-size="10">0.68M</text>
  <text x="200" y="137" text-anchor="middle" fill="#FF4D6D" font-size="8">Reasoning (33.3%)</text>

  <!-- Argon bar stack -->
  <!-- Visible output: 1.03M → height = 1.03/2.0 * 240 = 124 -->
  <rect x="340" y="196" width="120" height="124" rx="3" fill="url(#argBar)" opacity="0.9"/>
  <!-- Reasoning: 0.17M → height = 0.17/2.0 * 240 = 20 -->
  <rect x="340" y="176" width="120" height="20" rx="3" fill="url(#reasonArg)" opacity="0.9"/>

  <!-- Argon labels -->
  <text x="400" y="265" text-anchor="middle" fill="#B8D4EA" font-size="10">1.03M</text>
  <text x="400" y="280" text-anchor="middle" fill="#4A6A8A" font-size="8">Visible Output</text>
  <text x="400" y="170" text-anchor="middle" fill="#FFD4DD" font-size="10">0.17M</text>
  <text x="400" y="158" text-anchor="middle" fill="#FF8C42" font-size="8">Reasoning (14.2%)</text>

  <!-- Local bar -->
  <!-- 0.08M → height = 0.08/2.0 * 240 = 10 -->
  <rect x="540" y="310" width="120" height="10" rx="3" fill="url(#locBar)" opacity="0.9"/>
  <text x="600" y="305" text-anchor="middle" fill="#FFB800" font-size="9">0.08M</text>

  <!-- Model names -->
  <text x="200" y="340" text-anchor="middle" fill="#4D94FF" font-size="11" font-weight="bold">z-ai/glm-5</text>
  <text x="200" y="352" text-anchor="middle" fill="#4A6A8A" font-size="8">Cost-Efficient Coder</text>
  <text x="400" y="340" text-anchor="middle" fill="#00FF88" font-size="11" font-weight="bold">gemini-4-argon</text>
  <text x="400" y="352" text-anchor="middle" fill="#4A6A8A" font-size="8">Deep Reasoner</text>
  <text x="600" y="340" text-anchor="middle" fill="#FFB800" font-size="11" font-weight="bold">gemma4:e4b</text>
  <text x="600" y="352" text-anchor="middle" fill="#4A6A8A" font-size="8">Local Compactor</text>

  <!-- Key insight box -->
  <rect x="680" y="90" width="110" height="80" rx="5" fill="#071120" stroke="#0D4054"/>
  <text x="735" y="108" text-anchor="middle" fill="#FF4D6D" font-size="9" font-weight="bold">KEY INSIGHT</text>
  <text x="735" y="124" text-anchor="middle" fill="#B8D4EA" font-size="8">GLM-5 "thought"</text>
  <text x="735" y="136" text-anchor="middle" fill="#B8D4EA" font-size="8">harder (33%) but</text>
  <text x="735" y="148" text-anchor="middle" fill="#B8D4EA" font-size="8">solved fewer bugs.</text>
  <text x="735" y="164" text-anchor="middle" fill="#FFB800" font-size="8">Quality &gt; Quantity</text>
</svg>
