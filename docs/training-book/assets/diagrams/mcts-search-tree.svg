<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Share Tech Mono', 'Courier New', monospace">
  <defs>
    <marker id="aW" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5CE1E6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#03060C" rx="8"/>
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#0D4054" rx="8"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#00F0FF" font-size="14" font-weight="bold" filter="url(#glow)">PUCT MCTS SEARCH — 4-STEP LOOP</text>
  <text x="400" y="52" text-anchor="middle" fill="#5CE1E6" font-size="10">Select → Expand → Evaluate → Backpropagate (×50 simulations per move)</text>

  <!-- ── STEP 1: SELECT ── -->
  <rect x="30" y="75" width="170" height="120" rx="6" fill="#071120" stroke="#FF4D6D" stroke-width="1.5"/>
  <text x="115" y="97" text-anchor="middle" fill="#FF4D6D" font-size="12" font-weight="bold">1. SELECT</text>
  <text x="115" y="115" text-anchor="middle" fill="#B8D4EA" font-size="9">PUCT formula:</text>
  <text x="115" y="132" text-anchor="middle" fill="#5CE1E6" font-size="8">U(s,a) = Q(s,a) +</text>
  <text x="115" y="146" text-anchor="middle" fill="#5CE1E6" font-size="8">c·P(s,a)·√N(s)/</text>
  <text x="115" y="160" text-anchor="middle" fill="#5CE1E6" font-size="8">(1+N(s,a))</text>
  <text x="115" y="180" text-anchor="middle" fill="#4A6A8A" font-size="8">Traverse max-PUCT path</text>

  <!-- Arrow 1→2 -->
  <path d="M200 135 L230 135" fill="none" stroke="#5CE1E6" stroke-width="1.5" marker-end="url(#aW)"/>

  <!-- ── STEP 2: EXPAND ── -->
  <rect x="230" y="75" width="170" height="120" rx="6" fill="#071120" stroke="#FFB800" stroke-width="1.5"/>
  <text x="315" y="97" text-anchor="middle" fill="#FFB800" font-size="12" font-weight="bold">2. EXPAND</text>
  <text x="315" y="115" text-anchor="middle" fill="#B8D4EA" font-size="9">At leaf s_L:</text>
  <text x="315" y="132" text-anchor="middle" fill="#5CE1E6" font-size="8">P_θ(a|s_L) → priors</text>
  <text x="315" y="146" text-anchor="middle" fill="#5CE1E6" font-size="8">Add Dirichlet noise</text>
  <text x="315" y="160" text-anchor="middle" fill="#5CE1E6" font-size="8">at root (α=0.3)</text>
  <text x="315" y="180" text-anchor="middle" fill="#4A6A8A" font-size="8">Create child nodes</text>

  <!-- Arrow 2→3 -->
  <path d="M400 135 L430 135" fill="none" stroke="#5CE1E6" stroke-width="1.5" marker-end="url(#aW)"/>

  <!-- ── STEP 3: EVALUATE ── -->
  <rect x="430" y="75" width="170" height="120" rx="6" fill="#071120" stroke="#00FF88" stroke-width="1.5"/>
  <text x="515" y="97" text-anchor="middle" fill="#00FF88" font-size="12" font-weight="bold">3. EVALUATE</text>
  <text x="515" y="115" text-anchor="middle" fill="#B8D4EA" font-size="9">Quiescence rollout:</text>
  <text x="515" y="132" text-anchor="middle" fill="#5CE1E6" font-size="8">Play greedy cascades</text>
  <text x="515" y="146" text-anchor="middle" fill="#5CE1E6" font-size="8">(depth ≤ 5)</text>
  <text x="515" y="160" text-anchor="middle" fill="#5CE1E6" font-size="8">V_θ(s_quiet) ± risk</text>
  <text x="515" y="180" text-anchor="middle" fill="#4A6A8A" font-size="8">Leaf value = v + bonus - risk</text>

  <!-- Arrow 3→4 -->
  <path d="M600 135 L630 135" fill="none" stroke="#5CE1E6" stroke-width="1.5" marker-end="url(#aW)"/>

  <!-- ── STEP 4: BACKPROPAGATE ── -->
  <rect x="630" y="75" width="140" height="120" rx="6" fill="#071120" stroke="#4D94FF" stroke-width="1.5"/>
  <text x="700" y="97" text-anchor="middle" fill="#4D94FF" font-size="12" font-weight="bold">4. BACKUP</text>
  <text x="700" y="115" text-anchor="middle" fill="#B8D4EA" font-size="9">Up the path:</text>
  <text x="700" y="132" text-anchor="middle" fill="#5CE1E6" font-size="8">N(s,a) += 1</text>
  <text x="700" y="146" text-anchor="middle" fill="#5CE1E6" font-size="8">W(s,a) += v</text>
  <text x="700" y="160" text-anchor="middle" fill="#5CE1E6" font-size="8">Q(s,a) = W/N</text>
  <text x="700" y="180" text-anchor="middle" fill="#4A6A8A" font-size="8">Virtual loss reset</text>

  <!-- ══ TREE VISUALIZATION ══ -->
  <text x="400" y="230" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="bold">SEARCH TREE (50 Simulations)</text>

  <!-- Root node -->
  <circle cx="400" cy="280" r="18" fill="#071120" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="284" text-anchor="middle" fill="#00F0FF" font-size="10" font-weight="bold">Root</text>
  <text x="400" y="308" text-anchor="middle" fill="#4A6A8A" font-size="8">N=50</text>

  <!-- Level 1 children -->
  <line x1="385" y1="296" x2="200" y2="350" stroke="#5CE1E6" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="400" y1="298" x2="350" y2="350" stroke="#5CE1E6" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="415" y1="296" x2="500" y2="350" stroke="#5CE1E6" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="415" y1="296" x2="620" y2="350" stroke="#5CE1E6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Best child (most visited) -->
  <circle cx="200" cy="365" r="14" fill="#071120" stroke="#FF4D6D" stroke-width="2"/>
  <text x="200" y="369" text-anchor="middle" fill="#FF4D6D" font-size="9">a₁</text>
  <text x="200" y="390" text-anchor="middle" fill="#FF4D6D" font-size="8">N=18 Q=+0.34</text>

  <!-- Second child -->
  <circle cx="350" cy="365" r="11" fill="#071120" stroke="#FFB800" stroke-width="1.5"/>
  <text x="350" y="369" text-anchor="middle" fill="#FFB800" font-size="9">a₂</text>
  <text x="350" y="386" text-anchor="middle" fill="#FFB800" font-size="8">N=13 Q=+0.21</text>

  <!-- Third child -->
  <circle cx="500" cy="365" r="9" fill="#071120" stroke="#4D94FF" stroke-width="1"/>
  <text x="500" y="369" text-anchor="middle" fill="#4D94FF" font-size="9">a₃</text>
  <text x="500" y="386" text-anchor="middle" fill="#4D94FF" font-size="8">N=11 Q=-0.12</text>

  <!-- Low-visit child -->
  <circle cx="620" cy="365" r="6" fill="#071120" stroke="#4A6A8A" stroke-width="1"/>
  <text x="620" y="386" text-anchor="middle" fill="#4A6A8A" font-size="8">N=8</text>

  <!-- Level 2 from best child -->
  <line x1="190" y1="378" x2="120" y2="420" stroke="#5CE1E6" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="200" y1="379" x2="200" y2="420" stroke="#5CE1E6" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="210" y1="378" x2="280" y2="420" stroke="#5CE1E6" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="120" cy="430" r="5" fill="#071120" stroke="#5CE1E6" stroke-width="0.8"/>
  <circle cx="200" cy="430" r="5" fill="#071120" stroke="#5CE1E6" stroke-width="0.8"/>
  <circle cx="280" cy="430" r="5" fill="#071120" stroke="#5CE1E6" stroke-width="0.8"/>

  <!-- Output distribution -->
  <rect x="60" y="455" width="680" height="35" rx="4" fill="#071120" stroke="#0D4054"/>
  <text x="400" y="477" text-anchor="middle" fill="#00FF88" font-size="10" font-weight="bold">OUTPUT: π_MCTS ∝ N(root, a) — Visit-count policy target for network training</text>
</svg>
