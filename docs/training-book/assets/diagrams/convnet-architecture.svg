<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Share Tech Mono', 'Courier New', monospace">
  <defs>
    <marker id="aD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5CE1E6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#03060C" rx="8"/>
  <rect x="1" y="1" width="898" height="618" fill="none" stroke="#0D4054" rx="8"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#00F0FF" font-size="15" font-weight="bold" filter="url(#glow)">2-HEAD CONVNET ARCHITECTURE — Triantica Champion (TF-B15)</text>
  <text x="450" y="52" text-anchor="middle" fill="#5CE1E6" font-size="10">10×10×18 Canonical Input → 3×Conv2D Trunk → Dual Heads → P(a|s) + V(s)</text>

  <!-- ── INPUT TENSOR ── -->
  <rect x="30" y="80" width="140" height="200" rx="6" fill="#071120" stroke="#0D4054" stroke-width="1"/>
  <text x="100" y="100" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="bold">INPUT TENSOR</text>
  <text x="100" y="118" text-anchor="middle" fill="#B8D4EA" font-size="10">[10, 10, 18]</text>
  <line x1="45" y1="128" x2="155" y2="128" stroke="#0D4054"/>
  <text x="100" y="146" text-anchor="middle" fill="#5CE1E6" font-size="9">18 channels:</text>
  <text x="55" y="164" fill="#FF4D6D" font-size="9">Ch 0-3:  My rotations</text>
  <text x="55" y="178" fill="#4D94FF" font-size="9">Ch 4-7:  Opp rotations</text>
  <text x="55" y="192" fill="#5CE1E6" font-size="9">Ch 8-11: My clusters</text>
  <text x="55" y="206" fill="#5CE1E6" font-size="9">Ch 12-15:Opp clusters</text>
  <text x="55" y="220" fill="#FFB800" font-size="9">Ch 16: Turn flag</text>
  <text x="55" y="234" fill="#FFB800" font-size="9">Ch 17: Move count</text>
  <text x="55" y="254" fill="#4A6A8A" font-size="8">+ToroidalPad2D(1)</text>

  <!-- Arrow input→conv1 -->
  <path d="M170 180 L210 180" fill="none" stroke="#5CE1E6" stroke-width="1.5" marker-end="url(#aD)"/>

  <!-- ── CONV TRUNK ── -->
  <rect x="210" y="70" width="360" height="210" rx="8" fill="url(#trunkG)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="390" y="92" text-anchor="middle" fill="#00F0FF" font-size="12" font-weight="bold">CONV2D TRUNK (Shared)</text>

  <!-- Conv Block 1 -->
  <rect x="230" y="105" width="100" height="60" rx="5" fill="#060B14" stroke="#0D4054"/>
  <text x="280" y="125" text-anchor="middle" fill="#4D94FF" font-size="10" font-weight="bold">Conv2D Block 1</text>
  <text x="280" y="140" text-anchor="middle" fill="#B8D4EA" font-size="9">3×3, 64 filters</text>
  <text x="280" y="154" text-anchor="middle" fill="#5CE1E6" font-size="8">+BN +ReLU</text>

  <!-- Arrow -->
  <path d="M330 135 L345 135" fill="none" stroke="#5CE1E6" stroke-width="1" marker-end="url(#aD)"/>

  <!-- Conv Block 2 -->
  <rect x="345" y="105" width="100" height="60" rx="5" fill="#060B14" stroke="#0D4054"/>
  <text x="395" y="125" text-anchor="middle" fill="#4D94FF" font-size="10" font-weight="bold">Conv2D Block 2</text>
  <text x="395" y="140" text-anchor="middle" fill="#B8D4EA" font-size="9">3×3, 128 filters</text>
  <text x="395" y="154" text-anchor="middle" fill="#5CE1E6" font-size="8">+BN +ReLU</text>

  <!-- Arrow -->
  <path d="M445 135 L460 135" fill="none" stroke="#5CE1E6" stroke-width="1" marker-end="url(#aD)"/>

  <!-- Conv Block 3 -->
  <rect x="460" y="105" width="100" height="60" rx="5" fill="#060B14" stroke="#0D4054"/>
  <text x="510" y="125" text-anchor="middle" fill="#4D94FF" font-size="10" font-weight="bold">Conv2D Block 3</text>
  <text x="510" y="140" text-anchor="middle" fill="#B8D4EA" font-size="9">3×3, 128 filters</text>
  <text x="510" y="154" text-anchor="middle" fill="#5CE1E6" font-size="8">+BN +ReLU</text>

  <!-- ToroidalPad annotation -->
  <rect x="230" y="175" width="330" height="28" rx="4" fill="rgba(0,240,255,0.04)" stroke="#0D4054" stroke-dasharray="4 3"/>
  <text x="395" y="193" text-anchor="middle" fill="#5CE1E6" font-size="9">Every Conv2D: ToroidalPad2D(1) → circular equivariance on T² torus</text>

  <!-- Receptive field annotation -->
  <text x="395" y="250" text-anchor="middle" fill="#4A6A8A" font-size="9">Receptive fields: 3×3 → 5×5 → 7×7 (covers majority of 10×10 board)</text>

  <!-- ── SPLIT ARROWS ── -->
  <path d="M390 280 L390 310 L260 340" fill="none" stroke="#FF4D6D" stroke-width="2" marker-end="url(#aD)"/>
  <path d="M390 280 L390 310 L560 340" fill="none" stroke="#00FF88" stroke-width="2" marker-end="url(#aD)"/>
  <text x="310" y="318" fill="#FF4D6D" font-size="9">Policy Path</text>
  <text x="510" y="318" fill="#00FF88" font-size="9">Value Path</text>

  <!-- ── POLICY HEAD ── -->
  <rect x="140" y="340" width="240" height="170" rx="8" fill="#071120" stroke="#FF4D6D" stroke-width="1.5"/>
  <text x="260" y="365" text-anchor="middle" fill="#FF4D6D" font-size="12" font-weight="bold" filter="url(#glow)">POLICY HEAD (Where to play)</text>

  <rect x="160" y="380" width="200" height="36" rx="4" fill="#060B14" stroke="#0D4054"/>
  <text x="260" y="398" text-anchor="middle" fill="#B8D4EA" font-size="9">Conv2D 1×1 → 64 → BN → ReLU</text>
  <text x="260" y="410" text-anchor="middle" fill="#4A6A8A" font-size="8">[10, 10, 64]</text>

  <rect x="160" y="425" width="200" height="36" rx="4" fill="#060B14" stroke="#0D4054"/>
  <text x="260" y="443" text-anchor="middle" fill="#B8D4EA" font-size="9">Conv2D 1×1 → 4 → Softmax</text>
  <text x="260" y="455" text-anchor="middle" fill="#4A6A8A" font-size="8">[10, 10, 4] = 400 logits</text>

  <rect x="160" y="470" width="200" height="28" rx="4" fill="rgba(255,77,109,0.08)" stroke="#FF4D6D" stroke-dasharray="4 2"/>
  <text x="260" y="488" text-anchor="middle" fill="#FF4D6D" font-size="10" font-weight="bold">P(a|s) ∈ [0,1] — 400 moves</text>

  <!-- ── VALUE HEAD ── -->
  <rect x="440" y="340" width="240" height="170" rx="8" fill="#071120" stroke="#00FF88" stroke-width="1.5"/>
  <text x="560" y="365" text-anchor="middle" fill="#00FF88" font-size="12" font-weight="bold" filter="url(#glow)">VALUE HEAD (Who wins)</text>

  <rect x="460" y="380" width="200" height="36" rx="4" fill="#060B14" stroke="#0D4054"/>
  <text x="560" y="398" text-anchor="middle" fill="#B8D4EA" font-size="9">Conv2D 1×1 → 32 → BN → ReLU</text>
  <text x="560" y="410" text-anchor="middle" fill="#4A6A8A" font-size="8">[10, 10, 32]</text>

  <rect x="460" y="425" width="200" height="36" rx="4" fill="#060B14" stroke="#0D4054"/>
  <text x="560" y="443" text-anchor="middle" fill="#B8D4EA" font-size="9">Flatten → Dense(256) → ReLU</text>
  <text x="560" y="455" text-anchor="middle" fill="#4A6A8A" font-size="8">[256]</text>

  <rect x="460" y="470" width="200" height="28" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00FF88" stroke-dasharray="4 2"/>
  <text x="560" y="488" text-anchor="middle" fill="#00FF88" font-size="10" font-weight="bold">V(s) ∈ [-1, +1] — Win prob</text>

  <!-- ── LOSS FUNCTION ── -->
  <rect x="180" y="540" width="540" height="60" rx="8" fill="#071120" stroke="#FFB800" stroke-width="1"/>
  <text x="450" y="565" text-anchor="middle" fill="#FFB800" font-size="12" font-weight="bold">COMBINED LOSS</text>
  <text x="450" y="585" text-anchor="middle" fill="#B8D4EA" font-size="10">L = CE(π_MCTS, P_θ) + λ · MSE(z, V_θ)  where z = ±1 game outcome, λ = 0.5</text>

  <!-- Connections to loss -->
  <path d="M260 510 L260 530 L260 540" fill="none" stroke="#FF4D6D" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M560 510 L560 530 L560 540" fill="none" stroke="#00FF88" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
